[versions]
# Build toolchain.
agp = "9.4.1"
kotlin = "2.3.21"
ksp = "2.3.21-2.0.4"
# lint = AGP major + 23; shipped to consumers via :lustro-lint.
lint = "32.2.1"

# Android SDK levels.
compileSdk = "35"
minSdk = "24"
targetSdk = "35"

# Library runtime: the dependencies of the published :lustro / :lustro-noop
# artifacts. Each is a floor, the oldest version with the APIs Lustro uses, so
# that adding Lustro does not raise an app's own versions (Gradle keeps the
# higher one). Dependabot ignores them, consumer-check/ builds an app with
# exactly these versions, and README.md documents them: move all of them
# together. kotlinFloor is the kotlin-stdlib the artifacts require and the
# language and API version they are compiled as (Kotlin 2.0 metadata).
kotlinFloor = "2.0.21"
okhttp = "4.12.0"
nanohttpd = "2.3.1"
androidxLifecycle = "2.4.1"
# compileOnly in :lustro-api (CLASS-retention annotations), so not published.
androidxAnnotation = "1.11.0"
# compileOnly in :lustro-prefs and :lustro-prefs-noop, so not published: an app
# that registers a Preferences DataStore brings its own. The oldest DataStore
# release, and the coroutines that it depends on, so that every call the tab
# makes exists in any app that has DataStore.
datastoreFloor = "1.0.0"
coroutinesFloor = "1.5.0"
# compileOnly in :lustro-sqlite and :lustro-sqlite-noop, so not published: an app
# that registers a SupportSQLiteDatabase, such as Room's, brings its own. The
# first androidx release has every call that the tab makes.
sqliteFloor = "2.0.0"

# Sample app only.
volley = "1.2.1"
# The sample's UI, on the newest line that compiles against compileSdk 35:
# Compose 1.9 (BOM 2025.08.00) and activity 1.11 need 36. .github/dependabot.yml
# holds them here.
composeBom = "2025.07.00"
activityCompose = "1.10.1"
# The sample's Preferences DataStore. The prefs unit tests use it too, for the
# byte array values that DataStore 1.1 added.
datastore = "1.1.7"
# The sample's SupportSQLiteOpenHelper, the one Room uses, without Room. The
# sqlite unit tests use it too, for a live SupportSQLiteDatabase.
sqlite = "2.4.0"

# Build / publishing tooling.
detekt = "1.23.8"
bcv = "0.18.2"
vanniktech = "0.37.0"
dokka = "2.2.0"
kover = "0.9.11"

# Test.
junit = "4.13.2"
robolectric = "4.17"
json = "20260814"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
# Library runtime (published :lustro / :lustro-noop deps).
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "androidxLifecycle" }
datastore-core-floor = { group = "androidx.datastore", name = "datastore-core", version.ref = "datastoreFloor" }
datastore-preferences-core-floor = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastoreFloor" }
kotlinx-coroutines-core-floor = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutinesFloor" }
sqlite-floor = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqliteFloor" }

# Sample app only.
volley = { group = "com.android.volley", name = "volley", version.ref = "volley" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }
sqlite-framework = { group = "androidx.sqlite", name = "sqlite-framework", version.ref = "sqlite" }

# Test.
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
okhttp-tls = { group = "com.squareup.okhttp3", name = "okhttp-tls", version.ref = "okhttp" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
json = { group = "org.json", name = "json", version.ref = "json" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

# Lint check authoring (:lustro-lint).
lint-api = { group = "com.android.tools.lint", name = "lint-api", version.ref = "lint" }
lint-checks = { group = "com.android.tools.lint", name = "lint-checks", version.ref = "lint" }
lint = { group = "com.android.tools.lint", name = "lint", version.ref = "lint" }
lint-tests = { group = "com.android.tools.lint", name = "lint-tests", version.ref = "lint" }

# Build / publishing tooling. The convention plugins in build-logic/ compile
# against these; the root build puts the same plugins on the classpath.
android-gradle-api = { group = "com.android.tools.build", name = "gradle-api", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradle-plugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
vanniktech-gradle-plugin = { group = "com.vanniktech", name = "gradle-maven-publish-plugin", version.ref = "vanniktech" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
