# The oldest toolchain and dependency versions that Lustro supports: the values
# that README.md documents. CI builds this app with them as they are here, and
# once more with current versions passed as -P overrides (see
# .github/workflows/ci.yml). They are deliberately not read from the root
# version catalog: when a floor there moves up, this build has to fail.
agpVersion=8.6.1
kotlinVersion=2.0.21
compileSdk=35

# The app's own dependencies, at Lustro's floors. Lustro must not move any of
# them (checkLustroKeepsAppVersions). Lustro has no dependency on coroutines or
# on androidx.annotation, so those stay as they are at any version.
okhttpVersion=4.12.0
lifecycleVersion=2.4.1
coroutinesVersion=1.8.1
annotationVersion=1.8.2
# More dependencies of the app, as a comma-separated list of coordinates. The
# current-toolchain job adds the lifecycle Compose artifacts with it.
extraDependencies=

# The Lustro version to build against. Empty means VERSION_NAME from the root
# gradle.properties.
lustroVersion=

android.useAndroidX=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
