# The documentation site, built with Zensical (https://zensical.org) from the
# Markdown in docs/. `.github/workflows/docs.yml` builds it with --strict and
# publishes it to GitHub Pages, with the Dokka API reference under api/.
#
# Local preview:
#   python -m pip install -r docs/requirements.txt
#   zensical serve

[project]
site_name = "Lustro"
site_description = "A browser-based, agent-friendly debugging library for Android."
site_url = "https://twinsen81.github.io/Lustro/"
repo_url = "https://github.com/Twinsen81/Lustro"
repo_name = "Twinsen81/Lustro"
edit_uri = "edit/main/docs/"
copyright = "Lustro is licensed under the Apache License 2.0."
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/extra.css"]

# The pip pin for the docs build, not a page.
exclude_docs = """
requirements.txt
"""

nav = [
  { "Home" = "index.md" },
  { "User guide" = "https://github.com/Twinsen81/Lustro#readme" },
  { "Agents and automation" = "AGENTS.md" },
  { "Custom tab styleguide" = "STYLEGUIDE.md" },
  { "Kotlin API reference" = "https://twinsen81.github.io/Lustro/api/" },
  { "Changelog" = "https://github.com/Twinsen81/Lustro/blob/main/CHANGELOG.md" },
]

[project.theme]
language = "en"
logo = "assets/logo.png"
favicon = "assets/favicon.png"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true

[project.validation]
invalid_links = true
invalid_link_anchors = true
