version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Kotlin is upgraded deliberately, not on the automated cadence: KSP is
    # version-locked to the exact Kotlin release, and the Android modules' Kotlin
    # comes from AGP's built-in compiler rather than this catalog ref, so a lone
    # catalog bump only moves the JVM modules and skews the published artifacts.
    # The trailing "." / ":" keep org.jetbrains.kotlinx (the BCV and Kover plugins) in scope.
    ignore:
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "org.jetbrains.kotlin.*"
      # The runtime dependencies of the published artifacts are floors: Lustro
      # declares the oldest version with the APIs it uses, and an app keeps its
      # own, newer version. A bump here would raise the floor for every app, so
      # these move by hand, together with consumer-check/ and README.md (see
      # DECISIONS.md, "Dependency floors"). OkHttp types are also part of the
      # public API, and okhttp-android 5.x requires compileSdk 36.
      - dependency-name: "com.squareup.okhttp3:*"
      - dependency-name: "androidx.lifecycle:*"
      - dependency-name: "org.nanohttpd:*"
      # The sample's Compose UI stays on the newest line that compiles against
      # compileSdk 35: Compose 1.9 (BOM 2025.08.00) and activity 1.11 need 36.
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">= 2025.08.00"]
      - dependency-name: "androidx.activity:*"
        versions: [">= 1.11.0"]
    groups:
      gradle-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions need their directory
    # listed explicitly or Dependabot never sees them.
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/lustro-cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
