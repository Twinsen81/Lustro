version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Kotlin is upgraded deliberately, not on the automated cadence: KSP is
    # version-locked to the exact Kotlin release, and the Android modules' Kotlin
    # comes from AGP's built-in compiler rather than this catalog ref, so a lone
    # catalog bump only moves the JVM modules and skews the published artifacts.
    # The trailing "." / ":" keep org.jetbrains.kotlinx (the BCV and Kover plugins) in scope.
    ignore:
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "org.jetbrains.kotlin.*"
      # The runtime dependencies of the published artifacts are floors: Lustro
      # declares the oldest version with the APIs it uses, and an app keeps its
      # own, newer version. A bump here would raise the floor for every app, so
      # these move by hand, together with consumer-check/ and
      # docs/get-started/install.md (see DECISIONS.md, "Dependency floors"). OkHttp types are also part of the
      # public API, and okhttp-android 5.x requires compileSdk 36.
      - dependency-name: "com.squareup.okhttp3:*"
      - dependency-name: "androidx.lifecycle:*"
      - dependency-name: "org.nanohttpd:*"
      # The compileOnly floors of the plugin modules (datastoreFloor,
      # coroutinesFloor, sqliteFloor, workFloor, composeUiFloor) are floors for
      # the same reason: the tab calls the app's own copy, so code compiled
      # against a newer release can call a method that an older app does not
      # have. Some of these artifacts are also in the catalog under the
      # sample's or the tests' versions, and Dependabot does not tell the two
      # declarations apart, so it raised the floors together with them. The
      # sample and test versions can still move through the artifacts that
      # share their version key (datastore-preferences for "datastore",
      # work-testing for "work"). If they do not, move them by hand.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-core"
      - dependency-name: "androidx.datastore:datastore-core"
      - dependency-name: "androidx.datastore:datastore-preferences-core"
      - dependency-name: "androidx.sqlite:sqlite"
      - dependency-name: "androidx.work:work-runtime"
      - dependency-name: "androidx.work:work-analytics"
      - dependency-name: "androidx.compose.ui:ui"
      # The sample's Compose UI stays on the newest line that compiles against
      # compileSdk 35: Compose 1.9 (BOM 2025.08.00) and activity 1.11 need 36.
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">= 2025.08.00"]
      - dependency-name: "androidx.activity:*"
        versions: [">= 1.11.0"]
    groups:
      gradle-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions need their directory
    # listed explicitly or Dependabot never sees them.
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/lustro-cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The Zensical pin of the docs site build (docs.yml).
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
