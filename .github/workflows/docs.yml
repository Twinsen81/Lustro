name: Docs

# Builds the documentation site from docs/ with Zensical (zensical.toml) and,
# on main, publishes it to GitHub Pages with the Dokka API reference under api/
# and the wire-protocol schemas under wire-protocol/. The repository's Pages
# source must be "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# A run on a branch gives way to a newer one. On main, a deploy that has
# started is never cancelled, so the site does not stop halfway.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build the docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Zensical
        run: python -m pip install -r docs/requirements.txt

      # --strict fails the build on a link to a page or an anchor that is not there.
      - name: Build the site
        run: zensical build --clean --strict

      # The Kotlin API reference of every module that applies lustro.publishing
      # (see the root build.gradle.kts). Only a run on main, which deploys,
      # needs it: a pull request, or a manual run on another branch, stops at
      # the strict build above and never publishes that branch.
      - name: Set up JDK + Gradle
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/setup

      - name: Generate Dokka HTML
        if: ${{ github.ref == 'refs/heads/main' }}
        run: ./gradlew dokkaGenerate --console=plain --stacktrace

      - name: Add the API reference to the site
        if: ${{ github.ref == 'refs/heads/main' }}
        run: cp -R build/dokka/html site/api

      # The schemas of the wire protocol, at the URLs that their $id fields name.
      # The page docs/wire-protocol.md already makes site/wire-protocol/, so
      # copy the contents: `cp -R wire-protocol site/wire-protocol` would put
      # them one level deeper. It runs in pull requests too, so that a page
      # that takes one of these paths fails the build there.
      - name: Add the wire protocol to the site
        run: |
          cp -R wire-protocol/. site/wire-protocol/
          test -f site/wire-protocol/v1/meta.schema.json

      - name: Upload the site
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the uploaded site
      id-token: write # prove to Pages that this run made the upload
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
