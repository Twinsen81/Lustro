name: Docs

# Builds the documentation site from docs/ with Zensical (zensical.toml) and,
# on main, publishes it to GitHub Pages with the Dokka API reference under api/
# and, under wire-protocol/, the wire-protocol schemas and the bundle that
# GET /api/v1/_schema serves. The repository's Pages source must be
# "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
      - "wire-protocol/**"
      - "lustro/src/main/assets/lustro/_schema.json"
  workflow_dispatch:

permissions:
  contents: read

# A run on a branch gives way to a newer one. On main, a deploy that has
# started is never cancelled, so the site does not stop halfway.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build the docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15" # the Python of the locks: CONTRIBUTING.md, "Python lock files"

      # The lock has Zensical and its dependencies, with hashes (see
      # CONTRIBUTING.md, "Python lock files").
      - name: Install Zensical
        run: python -m pip install --require-hashes -r docs/requirements.txt

      # --strict fails the build on a link to a page or an anchor that is not there.
      - name: Build the site
        run: zensical build --clean --strict

      # The Kotlin API reference of every module that applies lustro.publishing
      # (see the root build.gradle.kts). Only a run on main, which deploys,
      # needs it: a pull request, or a manual run on another branch, stops at
      # the strict build above and never publishes that branch.
      - name: Set up JDK + Gradle
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/setup

      - name: Generate Dokka HTML
        if: ${{ github.ref == 'refs/heads/main' }}
        run: ./gradlew dokkaGenerate --console=plain --stacktrace

      - name: Add the API reference to the site
        if: ${{ github.ref == 'refs/heads/main' }}
        run: cp -R build/dokka/html site/api

      # The schemas of the wire protocol, at the URLs that their $id fields name.
      # The page docs/wire-protocol.md already makes site/wire-protocol/, so
      # copy the contents: `cp -R wire-protocol site/wire-protocol` would put
      # them one level deeper. The bundle that GET /api/v1/_schema serves is an
      # asset of the lustro module, not a file in wire-protocol/, so copy it
      # too. Then every $id in the repository's JSON files that names a URL of
      # this site must be a file in the site. It runs in pull requests too, so
      # that a page that takes one of these paths, or a schema that is not
      # copied, fails the build there.
      - name: Add the wire protocol to the site
        run: |
          cp -R wire-protocol/. site/wire-protocol/
          cp lustro/src/main/assets/lustro/_schema.json site/wire-protocol/v1/_schema.json
          paths=$(git grep -h -o -E '"[$]id": *"https://twinsen81\.github\.io/Lustro/[^"]+"' -- '*.json' \
            | sed -E 's|.*/Lustro/([^"]+)"$|\1|' | sort -u)
          test -n "$paths"
          missing=0
          for path in $paths; do
            if [ ! -f "site/$path" ]; then
              echo "::error::A \$id names $path, and the site has no file there"
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload the site
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the uploaded site
      id-token: write # prove to Pages that this run made the upload
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
