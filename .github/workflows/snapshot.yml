name: Publish snapshot

on:
  push:
    branches: [main]

permissions:
  contents: read

# As in release.yml, the job that runs Gradle, build, gets no secrets, and the
# job that gets the signing key and the Central credentials, publish, runs no
# Gradle: see SECURITY.md, "Release Publishing". Each action is pinned to a
# full commit SHA, with its version in a comment.

jobs:
  # --- Build: the unsigned publications, no secrets ---------------------------
  # A newer push to main cancels the build of the push before it.
  build:
    name: Build the snapshot publications
    runs-on: ubuntu-latest
    concurrency:
      group: snapshot-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK + Gradle
        uses: ./.github/actions/setup

      # Guard: only publish when VERSION_NAME ends with -SNAPSHOT. A non-SNAPSHOT
      # version on main means a release is in flight (release.yml owns that), so
      # this workflow publishes nothing, to avoid clobbering a staged release.
      - name: Resolve version and gate
        id: gate
        run: |
          VERSION="$(./gradlew -q :lustro:properties --console=plain \
            | awk -F': ' '/^version:/ {print $2; exit}')"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is a snapshot: the publish job publishes it."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is NOT a snapshot: no snapshot publish."
          fi

      # The publications of every module that applies lustro.publishing (the
      # library artifacts and :lustro-wire-schema), unsigned, in
      # build/staging-deploy, with the timestamped file names of a snapshot.
      - name: Build the publications
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: ./gradlew publishAllPublicationsToStagingRepository --console=plain --stacktrace

      - name: Upload the unsigned publications
        if: ${{ steps.gate.outputs.publish == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-staging
          path: build/staging-deploy/
          if-no-files-found: error
          retention-days: 7

  # --- Publish: sign and upload to the Central snapshot repository ------------
  # The `snapshot` environment, which only main can use, holds the secrets.
  # Until the maintainer moves them there, the job reads the repository
  # secrets. A run is never cancelled: a cancelled upload could leave some
  # modules on a new snapshot and others on the one before. The script uploads
  # the files of all modules first and the metadata last, and a waiting run of
  # a newer push replaces a waiting older one.
  publish:
    name: Sign and publish the snapshot to Central
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.publish == 'true' }}
    environment: snapshot
    timeout-minutes: 30
    concurrency:
      group: snapshot-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download the unsigned publications
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-staging
          path: staging-deploy

      - name: Sign the publications and write their checksums
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: >-
          python3 .github/scripts/central_publish.py prepare --repo staging-deploy
          --out central --properties gradle.properties

      # Each module gets the next build number of the snapshot repository, and
      # the script writes the maven-metadata.xml files that name the new files.
      - name: Upload the snapshot
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: python3 .github/scripts/central_publish.py snapshot --dir central --properties gradle.properties
