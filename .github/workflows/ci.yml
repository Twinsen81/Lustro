name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same PR/branch. `github.head_ref` is set only on
# pull_request events, so PR runs are grouped (and cancelled) per source branch,
# while pushes to main fall back to the unique run id and are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- DCO: every PR commit must carry a Signed-off-by trailer ----------------
  # Enforces the Developer Certificate of Origin sign-off required by
  # CONTRIBUTING. Merge commits are exempt (GitHub-generated merges can't be
  # signed); only the commit range introduced by the PR is checked.
  dco:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the full PR commit range, not just the tip

      - name: Verify Signed-off-by on each commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            # Bots (Dependabot et al.) can't sign off; the DCO certifies human
            # contributors, so exempt commits authored by a [bot] account.
            author=$(git show -s --format='%an <%ae>' "$c")
            case "$author" in
              *"[bot]"*) continue ;;
            esac
            if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: .\+ <.\+@.\+>$'; then
              echo "::error::Commit $c is missing a Signed-off-by line"
              git show -s --format='  %h %s' "$c"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Add sign-off with 'git commit -s', or backfill with 'git rebase --signoff <base>'."
            exit 1
          fi

  # --- Gradle: build, test, and all static/ABI/contract gates -----------------
  gradle:
    name: Build, test, lint, API & facade checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK + Gradle
        uses: ./.github/actions/setup

      # The Maven coordinates that README.md, the pages in docs/, llms.txt,
      # context7.json, and the lustro skill give to people and agents must match
      # gradle.properties (see gradle/docs-version.gradle.kts). Each plugin
      # module pair must have its page, nav line, llms.txt link, context7.json
      # folder, and modules table rows, and the links in README.md and llms.txt
      # must name files and pages that exist (see gradle/plugin-docs.gradle.kts).
      # Both read text only, so they run first.
      - name: Integration docs name the current coordinates, and each plugin has its docs
        run: ./gradlew checkDocsVersion checkPluginDocs --console=plain --stacktrace

      # A release publishes lustro-cli with the library's version, so its
      # __version__ must be VERSION_NAME without -SNAPSHOT, and its
      # PROTOCOL_VERSION must be the server's wire protocol version (see
      # gradle/cli-version.gradle.kts). It also reads text only.
      - name: The CLI has the library's version and protocol version
        run: ./gradlew checkCliVersion --console=plain --stacktrace

      - name: Assemble all modules
        run: ./gradlew assemble --console=plain --stacktrace

      # The published modules compile against the floor's kotlin-stdlib, not a
      # newer one a dependency brings (see build-logic/.../CheckKotlinFloorTask.kt).
      - name: Published modules compile against the Kotlin floor
        run: ./gradlew checkKotlinFloor --console=plain --stacktrace

      # Gradle resolves the android-all jars that Robolectric runs the tests on,
      # and the tests read them offline, so a test downloads nothing (see
      # gradle/robolectric.gradle.kts).
      - name: Unit + Robolectric tests
        run: ./gradlew test --console=plain --stacktrace

      # The convention plugins' own tests, among them a runtime and no-op pair
      # that checkFacadeParity must reject. `test` above does not reach them:
      # build-logic is an included build.
      - name: Build logic tests
        run: ./gradlew :build-logic:test --console=plain --stacktrace

      # The modules compile against OkHttp 4.12.0, the floor, and an app on OkHttp
      # 5 runs them against that. Same suite, OkHttp 5 on the test runtime
      # classpath (see the root build.gradle.kts).
      - name: Unit + Robolectric tests against OkHttp 5
        run: ./gradlew :lustro:testDebugUnitTest :sample:testDebugUnitTest -PlustroTestOkHttpVersion=5.5.0 --console=plain --stacktrace

      - name: Android Lint (runtime + sample, incl. release-safety check)
        run: ./gradlew :lustro:lintDebug :sample:lintDebug --console=plain --stacktrace

      - name: Detekt
        run: ./gradlew detekt --console=plain --stacktrace

      # Each published module with a Kotlin API has a baseline in api/: BCV's
      # own tasks for :lustro-api, and the ones that lustro.android-library
      # registers for the Android modules (see DECISIONS.md, "BCV / apiCheck").
      - name: Public API check (BCV; a baseline for each published module)
        run: ./gradlew apiCheck --console=plain --stacktrace

      # The no-op halves ship no keep rule, so R8 removes their classes or
      # renames them: no class of the release build has a Lustro name (see
      # checkReleaseHasNoLustroClasses in sample/build.gradle.kts).
      - name: Sample debug + release (R8) compile, no Lustro class name in release
        run: ./gradlew :sample:assembleDebug :sample:assembleRelease :sample:checkReleaseHasNoLustroClasses --console=plain --stacktrace

      # The release-safe no-op half of each pair must match its runtime facade
      # exactly, :lustro-noop to :lustro first. It compares the API dumps of the
      # two halves (see the facadeParity block of the root build.gradle.kts).
      - name: Facade parity (runtime vs no-op pairs)
        run: ./gradlew checkFacadeParity --console=plain --stacktrace

      # What release.yml attaches to the GitHub Release, so that a change to the
      # published modules fails here and not at the release tag.
      - name: Release artifacts
        run: ./gradlew collectReleaseArtifacts --console=plain --stacktrace

      # Each published module asks for its own version of every other one, so
      # that an app gets one version of all Lustro modules. The constraints come
      # from the lustro.publishing plugin in build-logic/; this checks that they
      # reach the .module file of each module.
      - name: Published metadata asks for one version of all Lustro modules
        run: ./gradlew checkPublishedConstraints --console=plain --stacktrace

      # What docs.yml publishes under api/ on the docs site at each push to main,
      # so that a change that breaks Dokka fails here and not the deploy.
      - name: API reference (Dokka)
        run: ./gradlew dokkaGenerate --console=plain --stacktrace

      - name: Kover coverage report
        run: ./gradlew :lustro:koverXmlReport --console=plain --stacktrace

      - name: Upload Kover report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kover-report
          path: lustro/build/reports/kover/report.xml
          if-no-files-found: warn

      - name: Upload test + lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/detekt/**
          if-no-files-found: ignore

  # --- Consumer check: the published artifacts in an app on older tools --------
  # Adding Lustro must not raise an app's own dependency versions, and the
  # artifacts must build on the oldest toolchain that the docs promise
  # (docs/get-started/install.md, "Minimum versions"). The job
  # publishes the checkout to the local Maven repository, then builds the app in
  # consumer-check/ against it: once with that directory's gradle.properties,
  # the floors, and once with current versions, OkHttp 5 and the lifecycle
  # Compose artifacts among them. Its check task fails on any module whose
  # version Lustro changes. See consumer-check/README.md.
  consumer:
    name: Consumer check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest supported toolchain
            overrides: ""
          # OkHttp 5 is multiplatform, and its Android artifact carries AAR
          # metadata: 5.4.0 is the newest for compileSdk 36 (5.5.0 asks for 37).
          - name: current toolchain, OkHttp 5
            overrides: >-
              -PagpVersion=8.13.2 -PkotlinVersion=2.2.21 -PcompileSdk=36
              -PokhttpVersion=5.4.0 -PlifecycleVersion=2.10.0
              -PcoroutinesVersion=1.11.0 -PannotationVersion=1.11.0
              -PextraDependencies=androidx.lifecycle:lifecycle-runtime-compose:2.10.0,androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0
          # An app below the runtime's minSdk: its release build takes the no-op
          # halves at 23, and its debug build raises its own minSdk to 24.
          # WorkManager 2.12.0 needs 24, so this app has 2.10.3, with which the
          # WorkManager tab answers work_unsupported.
          - name: app minSdk 23, WorkManager 2.10
            overrides: "-PappMinSdk=23 -PworkVersion=2.10.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK + Gradle
        uses: ./.github/actions/setup

      - name: Publish the checkout to the local Maven repository
        run: ./gradlew publishToMavenLocal --console=plain --stacktrace

      - name: Build the app and check its dependency versions and release classes
        working-directory: consumer-check
        run: >-
          ./gradlew :app:assembleWithLustroDebug :app:assembleWithLustroRelease
          :app:checkLustroKeepsAppVersions :app:checkWithLustroReleaseHasNoLustroClasses
          ${{ matrix.overrides }} --console=plain --stacktrace

      # The release lint, which assembleRelease runs, must fail on a DebugTab
      # subclass in src/release and in src/main. It has the check only because
      # lustro-noop ships it too.
      - name: The release lint reports a DebugTab outside src/debug
        working-directory: consumer-check
        run: ./check-release-lint.sh ${{ matrix.overrides }}

  # --- CLI: Python wire-protocol contract tests -------------------------------
  cli:
    name: CLI contract tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lustro-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15" # the Python of the locks: CONTRIBUTING.md, "Python lock files"

      # Each package comes from requirements-test.txt, which locks the test
      # extras of pyproject.toml and hatchling, the build backend, with hashes.
      # So pip builds the CLI with what is installed, and --no-index makes it
      # fail rather than download a package that the lock does not have.
      - name: Install lustro-cli (with test extras)
        run: |
          python -m pip install --require-hashes -r requirements-test.txt
          python -m pip install --no-deps --no-build-isolation --no-index .

      - name: Run pytest
        run: pytest -q

      # A wrapper script that installs the CLI from main requires the revision of
      # a fix, so each pull request that changes a file under lustro-cli/src/
      # increases REVISION in src/lustro_cli/__init__.py by one. In a pull
      # request, the checkout is its merge commit, so the diff with the base
      # holds only the pull request's changes. Two pull requests that both set
      # the next number do not conflict, because git merges two identical edits
      # of a line, and the required checks are not strict. So the check also
      # runs on each push to main, from the commit before the push: the second
      # of the two fails there. The checkout has one commit: fetch the base too.
      - name: The revision check's own tests
        working-directory: .
        run: python -m pytest -q .github/scripts

      - name: A change to the CLI increases its revision
        working-directory: .
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          python .github/scripts/check_cli_revision.py "$BASE" HEAD

      # The owner of an action can move a tag or a branch to other code without
      # a change in this repository, and a commit SHA always names the same
      # code. So each `uses:` of a workflow or a composite action must name a
      # full commit SHA, a local path, or an image digest. The script skips
      # release.yml and snapshot.yml until they are pinned (see SKIPPED there).
      - name: Workflows use each action at a commit SHA
        working-directory: .
        run: python .github/scripts/check_action_pins.py

      # Guard against drift between the canonical wire sources and the copies the
      # CLI vendors under src/lustro_cli/wire/. sync.py locates the repo root
      # relative to its own file, so it must run from the source tree (PYTHONPATH=src),
      # NOT the non-editable site-packages install (whose path resolves outside the
      # checkout). If the refresh changes any vendored artifact, the working tree
      # differs and `git diff --exit-code` fails the job — re-run the sync and commit.
      - name: Wire artifacts are in sync
        run: |
          PYTHONPATH=src python -m lustro_cli.wire.sync
          git diff --exit-code -- src/lustro_cli/wire

  # --- Debug console JS: behavioural tests for the browser assets -------------
  # The console's JavaScript ships inside the runtime AAR but is not built by
  # Gradle, so it gets its own job rather than a Gradle task: a contributor
  # building the library should not need Node installed. Zero dependencies —
  # the runner is the one built into Node, so there is nothing to install.
  js:
    name: Debug console JS tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # A directory argument is not expanded by every Node version's test
      # runner, so the files are passed explicitly: the console's own tests in
      # lustro/, and a plugin's in its module, such as lustro-logs/.
      - name: Run tests
        run: node --test */src/test/js/*.test.js

  # --- Emulator matrix: instrumented tests, and the CLI end to end on 24 and 35
  # Only a real Android image can check the platform HttpURLConnection capture,
  # which reaches the platform's URL handlers by reflection, and the CLI's
  # discovery, which reads the line the runtime logs at the LustroToken tag. In
  # a public repository, standard runners are free, and ubuntu-latest exposes
  # /dev/kvm, so the x86_64 emulator runs with hardware acceleration. The job
  # needs no secrets, so it runs on fork PRs too. It has no path filter because
  # a required check that a filter skips stays pending on the PR.
  emulator:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    # An emulator or adb call that stalls would otherwise hold the check for
    # GitHub's default limit of 6 hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # minSdk, the target SDK, and the newest level with a `default` image.
        api-level: [24, 35, 36]
        # The CLI end to end runs on minSdk and the target SDK. For the Screen tab,
        # API 35 and 36 take the same code paths, and on API 36 the runner's
        # emulator often stops responding, with ANRs in the system UI and in
        # system_server, before the end to end reads the screen: the run then
        # fails for a reason that is not the change.
        include:
          - api-level: 24
            e2e: true
          - api-level: 35
            e2e: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK + Gradle
        uses: ./.github/actions/setup

      # The CLI end to end installs the CLI with pip, which the runner's system
      # Python refuses (PEP 668).
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15" # the Python of the locks: CONTRIBUTING.md, "Python lock files"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The action runs each line of `script` as its own `sh -c` command and
      # stops at the first one that fails. So the end-to-end steps live in a
      # script file.
      #
      # A hung instrumented test fails after its own time limit (timeout_msec
      # in lustro/build.gradle.kts), with its name in the report. Something
      # that hangs outside a test, such as an install, ends at this step's
      # time limit, which is below the job's, so the next step still uploads
      # the reports and logcat. logcat goes to its file from before the tests
      # start, so the file has the log also when the step is stopped. Its
      # output does not go to the action's pipes, so the line does not wait
      # for it.
      - name: connectedCheck, then the CLI end to end on API 24 and 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: Nexus 6
          script: |
            mkdir -p build
            adb logcat -v threadtime > build/connected-logcat.txt 2>&1 < /dev/null &
            ./gradlew connectedCheck --console=plain --stacktrace
            if [ "${{ matrix.e2e }}" = "true" ]; then .github/scripts/cli-e2e.sh; else echo "The CLI end to end runs on API 24 and 35"; fi
        timeout-minutes: 20

      - name: Upload test reports and logcat
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            build/connected-logcat.txt
            build/cli-e2e/*.json
            build/cli-e2e/*.jsonl
            build/cli-e2e/*.txt
          if-no-files-found: ignore

  # --- Emulator result: one check with a name the matrix does not change -----
  # Each matrix job above has its API level in its name. A branch ruleset that
  # requires those names needs an edit each time the matrix changes, and an
  # open PR with the old matrix then waits for a check that it never runs. So
  # the ruleset requires this job instead. It needs `always()`: without it,
  # GitHub skips this job when a matrix job fails, and a required check that is
  # skipped counts as passed.
  emulator-result:
    name: Instrumented tests
    runs-on: ubuntu-latest
    needs: emulator
    if: ${{ always() }}
    steps:
      - name: Every emulator job passed
        env:
          RESULT: ${{ needs.emulator.result }}
        run: |
          echo "Result of the emulator jobs: $RESULT"
          test "$RESULT" = "success"
